name: "Release"

on:
  push:
    tags: ["v*"]
    branches: ["develop"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MISE_EXPERIMENTAL: true

jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build the executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ghstats-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Rename the executable
        if: ${{ matrix.goos == 'windows' }}
        run: mv ghstats-${{ matrix.goos }}-${{ matrix.goarch }} ghstats-${{ matrix.goos }}-${{ matrix.goarch }}.exe

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Package the executable
        if: ${{ ! (matrix.goos == 'windows' && matrix.goarch == 'arm64') }}
        run: upx --best --lzma --force-macos ghstats*

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghstats-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ghstats-${{ matrix.goos }}-${{ matrix.goarch }}
            ghstats-${{ matrix.goos }}-${{ matrix.goarch }}.exe

  release:
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          preserve_order: true
          files: artifacts/*
